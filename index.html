*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}button,input,select{font:inherit}button{cursor:pointer}main{max-width:760px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 30px #20304a12}header{padding:30px 20px 22px;background:linear-gradient(135deg,#f8fdff,#eef7ff 55%,#fff8ed);border-bottom:1px solid #e6edf5}header b{font-size:10px;letter-spacing:2.5px;color:#0d8ca1}h1{font-size:27px;margin:7px 0 5px}header p,.lead{color:#68758a;line-height:1.65;margin:0}.homeSearch{margin-top:20px;position:relative}.homeSearch input,.search{width:100%;padding:15px 16px 15px 44px;border-radius:14px;border:1.5px solid #cbd8e6;background:#fff;color:#172033;font-size:16px;outline:none;box-shadow:0 4px 14px #25466a0a}.homeSearch:before{content:'⌕';position:absolute;left:16px;top:10px;font-size:25px;color:#73849b}.homeSearch input:focus,.search:focus{border-color:#2799b3;box-shadow:0 0 0 3px #2799b31a}nav{position:sticky;top:0;z-index:10;display:flex;overflow:auto;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid #e4eaf1}nav button{flex:1;min-width:70px;padding:13px 7px;background:none;border:0;color:#7b8799;font-size:12px;font-weight:800;white-space:nowrap}nav .on{color:#087f96;border-bottom:3px solid #16a0b7}section{padding:20px}.hero{padding:22px;border-radius:20px;background:linear-gradient(135deg,#e9f8fb,#f2f7ff);border:1px solid #cfe9ef;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:1.2px;color:#0d8ca1;font-weight:900}.hero h2{font-size:25px;margin:7px 0}.primary{background:#118ca3;color:white;border:0;border-radius:12px;padding:13px 16px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card,.lessonCard{position:relative;text-align:left;padding:17px;border:1px solid #dfe7ef;border-radius:16px;background:#fff;color:#172033;box-shadow:0 5px 16px #213a5810}.card b,.lessonCard b{display:block;font-size:16px;margin-bottom:6px}.card span,.lessonCard span{color:#718096;font-size:12px;line-height:1.5}.card.blue{border-top:4px solid #3699e6}.card.green{border-top:4px solid #27ad83}.card.orange{border-top:4px solid #f0a13b}.card.pink{border-top:4px solid #dd6f9d}.card.purple{border-top:4px solid #8b72db}.card.yellow{border-top:4px solid #e8b735}.recent{display:flex;gap:8px;overflow:auto;padding:3px 0 5px}.chip{border:1px solid #dce5ee;background:#f6f9fc;border-radius:999px;padding:8px 11px;white-space:nowrap;color:#516077;font-size:12px}.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin:24px 0 11px}.sectionTitle h2,.sectionTitle h3{margin:0}.term{padding:18px 0;border-bottom:1px solid #e8edf3}.term h3{margin:5px 0 8px;font-size:20px}.term p,.detail p,.diag p{margin:0;color:#536176;line-height:1.8}.tag{font-size:11px;color:#0d8ca1;font-weight:900}.star{float:right;background:#fff8db;border:1px solid #f1df8d;border-radius:9px;color:#d49a00;font-size:18px;padding:4px 8px}.lessonList{display:grid;gap:11px}.lessonCard{width:100%;border-left:5px solid #3c9fe4}.lessonCard:nth-child(2n){border-left-color:#25aa83}.lessonCard:nth-child(3n){border-left-color:#ef9a38}.arrow{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#9aa7b7;font-size:22px}.detailHero{padding:20px;border-radius:18px;background:linear-gradient(135deg,#edf9ff,#fff8ea);border:1px solid #d9e8f1}.detailHero h2{margin:6px 0 10px}.keybox{margin-top:15px;background:#fff;border-radius:14px;padding:15px;border:1px solid #dce6ef}.keyrow{display:flex;gap:10px;align-items:flex-start;margin:8px 0;line-height:1.55}.dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}.c1{background:#e45c5c}.c2{background:#1f9fbe}.c3{background:#e7a62f}.c4{background:#3ca978}.info{margin-top:14px;padding:16px;border-radius:14px;background:#f6f8fb;border-left:5px solid #7487a0}.info.warn{background:#fff8e8;border-left-color:#e8a52e}.info.good{background:#edf9f4;border-left-color:#35 3px 0}.tiny{font-size:11px;color:#7b8798;line-height:1.55}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{padding:11px;border-radius:11px;background:#ffffff18}.metric b{display:block;font-size:18px;margin-top:3px}.up{color:#16805f;font-weight:900}.down{color:#c55d42;font-weight:900}.muted{color:#718096;font-size:12px;line-height:1.6}.empty{padding:25px;text-align:center;color:#7b8798;background:#f7f9fb;border-radius:14px}footer{text-align:center;color:#8c98a8;font-size:11px;padding:35px 20px}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.skillrow{grid-template-columns:1.25fr .8fr .65fr}h1{font-size:25px}}

</style></head><body><main><header><b>GRANBLUE GUIDE</b><h1>グラブル攻略ノート</h1><p>調べる・学ぶ・計算する。</p></header><nav id="nav"></nav><div id="app"></div><footer>グラブル攻略ノート / β版</footer></main><script>
const terms=[['攻刃','武器スキルなどによる攻撃力上昇の代表的な仕組み。通常・方陣・EXなど異なる枠がある。','火力'],['方陣攻刃','主にマグナ系武器が持つ攻刃。対応するマグナ加護で効果量が強化される。','火力'],['EX攻刃','通常・方陣とは別系統の攻刃枠。基本的にマグナ・神石加護の対象外。','火力'],['加護','メイン召喚石やサポーター召喚石などが持つ編成強化効果。対象武器スキルを増幅するものもある。','召喚石'],['渾身','HPが高いほど攻撃性能が高くなる効果。現在HP割合が重要。','火力'],['背水','HPが低いほど攻撃性能が高くなる効果。現在HP割合が重要。','火力'],['守護','最大HPを上昇させる武器スキル。系統によって加護対象が異なる。','耐久'],['技巧','クリティカル発動率に関係する武器スキル。','火力'],['ダメージ上限','攻撃力を上げ続けてもダメージが同じ割合では伸びなくなる領域に関係する仕組み。','火力'],['与ダメージ上昇','条件を満たす攻撃のダメージに加算を行うタイプの効果。攻撃UPや上限UPとは別物。','火力'],['追撃','通常攻撃などに追加して発生するダメージ。種類によって共存可否が異なる。','戦闘'],['硬直','攻撃後などに次の攻撃操作へ移れない待ち時間。高速周回では重要。','速度'],['DPS','実時間あたりにどれだけダメージを出せるかを見る考え方。','速度'],['DPT','1ターンあたりのダメージを見る考え方。','速度'],['予兆','バトルシステムVer.2で敵の特殊技と解除条件などを事前表示する仕組み。','V2'],['ディスペル','敵の強化効果を消去する効果。','戦闘'],['クリア','味方の弱体効果を回復する効果。','戦闘'],['フルオ','フルオートの略。設定に従って自動で戦闘を進める。','戦闘'],['青箱','一部マルチに存在する特別報酬。獲得条件や仕組みはバトルごとに異なる。','マルチ']];
const lessons=[
{t:'火力はどう決まる？',lv:'基礎',keys:['表示攻撃力だけでは最終ダメージは決まらない','同じ攻刃枠は足し算、別の主要枠は掛け算が基本','渾身・背水があると現在HPも重要','上限付近では攻撃力以外を伸ばす必要がある'],body:'通常攻刃・方陣攻刃・EX攻刃などは、同じ枠をまとめたうえで別枠同士を乗算して考えるのが基本です。実ダメージではさらに属性、敵防御、クリティカル、与ダメ、上限などが関係します。'},
{t:'加護って何を強くする？',lv:'基礎',keys:['加護＝最終ダメージをその％だけ増やす、ではない','マグナ加護は対応する方陣スキルを強化','神石加護は対応する通常系スキルを強化','メインとサポーターの組み合わせで効果量が変わる'],body:'加護文に書かれた対象スキルの効果量を増幅するタイプがあります。武器スキル名と加護の対象が一致しているか確認するのが重要です。'},
{t:'片面と両面の考え方',lv:'中級',keys:['両面は対象スキルへの加護量を確保しやすい','片面はもう片方に別タイプの加護を置ける','どちらが強いかは武器構成と目的次第'],body:'片面・両面は単純な上下関係ではありません。技巧、渾身、HP、上限など編成が必要とする要素を見て決めます。'},
{t:'上限・与ダメ・攻撃UPの違い',lv:'中級',keys:['攻撃UP＝上限そのものを上げる効果ではない','上限UP＝上限付近で重要','与ダメ上昇＝攻撃UPとは別の加算要素','今どこが不足しているかで優先度が変わる'],body:'火力が伸びない時は「攻撃力不足」なのか「上限に近い」のかを切り分けます。同じ火力要素でも役割が違います。'},
{t:'表示ダメージと速度は別',lv:'中級',keys:['1ターン最大ダメージ＝最速ではない','演出・操作数・硬直が実時間に影響','DPTとDPSは分けて考える'],body:'周回では大きな数字だけでなく、1周に必要な時間まで含めて考える必要があります。'}];
let tab='home',lessonOpen=null,termOpen=null;let fav=JSON.parse(localStorage.getItem('gbfFav2')||'[]');let recent=JSON.parse(localStorage.getItem('gbfRecent')||'[]');const tabs=[['home','ホーム'],['terms','用語'],['learn','学ぶ'],['calc','計算'],['fav','★保存']];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function saveRecent(s){s=s.trim();if(!s)return;recent=[s,...recent.filter(x=>x!==s)].slice(0,6);localStorage.setItem('gbfRecent',JSON.stringify(recent))}
function doSearch(q){saveRecent(q);tab='terms';termOpen=null;render(q)}
function nav(){document.querySelector('#nav').innerHTML=tabs.map(x=>`<button class="${tab===x[0]?'on':''}" data-tab="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;lessonOpen=null;termOpen=null;render()})}
function toggleFav(id){fav=fav.includes(id)?fav.filter(v=>v!==id):[...fav,id];localStorage.setItem('gbfFav2',JSON.stringify(fav));render()}

const termDetail={
'攻刃':`<div class="remember"><b>覚える：攻撃力を上げる代表的な武器スキル。</b></div><p>攻刃には通常攻刃・方陣攻刃・EX攻刃などがあります。同じ計算枠の効果は合計し、異なる主要枠は掛け合わせて考えるのが基本です。</p><div class="exampleBox"><b>例</b><br>通常攻刃を複数積むと通常攻刃枠の中で合計。方陣攻刃やEX攻刃は別枠として計算されます。</div>`,
'方陣攻刃':`<div class="remember"><b>覚える：方陣攻刃はマグナ系加護で強くなる。</b></div><p>「○○方陣・攻刃」などの方陣スキルが持つ攻撃力UPです。通常攻刃とは別枠で、対応するマグナ系召喚石の加護によってスキル効果量が増幅されます。</p><div class="explain"><b>見る場所</b><br>武器スキル名に「方陣」があるか、召喚石の加護がその方陣スキルを対象にしているかを確認します。</div>`,
'EX攻刃':`<div class="remember"><b>覚える：EX攻刃は通常・方陣とは別枠。</b></div><p>EX攻刃はEX攻刃枠に加算されます。通常攻刃や方陣攻刃とは別枠なので、編成全体の倍率を考えるときに重要です。一般的なマグナ・神石のスキル加護で増幅される通常/方陣スキルとは扱いが異なります。</p>`,
'加護':`<div class="remember"><b>覚える：％より先に「何を強化する加護か」を見る。</b></div><p>召喚石の加護には、方陣スキルを強化するもの、通常系スキルを強化するもの、属性攻撃力を上げるものなどがあります。同じ150%UPでも対象が違えば計算上の意味は違います。</p><div class="exampleBox"><b>例</b><br>「方陣スキルの効果150%UP」は方陣スキルを増幅します。「属性攻撃力150%UP」と同じ意味ではありません。</div>`,
'渾身':`<div class="remember"><b>覚える：HPが高いほど火力を得やすい。</b></div><p>渾身は残りHP割合によって効果量が変わる火力要素です。HPを高く維持できるほど恩恵を受けやすいため、回復・バリア・被ダメージ軽減などとの相性も重要になります。</p>`,
'背水':`<div class="remember"><b>覚える：HPが低いほど火力を得やすい。</b></div><p>背水は残りHPが減るほど効果が大きくなる火力要素です。火力を得るためにHPを下げる一方、戦闘不能の危険も増えるので耐久手段とのバランスが必要です。</p>`,
'守護':`<div class="remember"><b>覚える：守護は最大HPを増やす。</b></div><p>守護は最大HPを増やす武器スキルです。通常系・方陣系などがあり、対応する加護によって効果量が変わるものがあります。火力だけでなく高難度やフルオートの安定性を考えるときに重要です。</p>`,
'技巧':`<div class="remember"><b>覚える：技巧はクリティカル率に関係する。</b></div><p>技巧はクリティカル発生率を上げる武器スキルです。通常技巧・方陣技巧などがあり、加護の影響も含めて発動率を考えます。クリティカルが有効になる属性条件も確認が必要です。</p>`,
'ダメージ上限':`<div class="remember"><b>覚える：十分な火力があると、攻撃力だけでは伸びにくくなる。</b></div><p>通常攻撃・奥義・アビリティなどにはダメージが伸びにくくなる上限側の仕組みがあります。上限付近まで届いている場合、攻刃を増やすより上限UPや与ダメージ上昇などが有効になることがあります。</p>`,
'与ダメージ上昇':`<div class="remember"><b>覚える：攻撃力UPとは別の火力要素。</b></div><p>与ダメージ上昇は、条件を満たした攻撃に一定量などを加算するタイプの効果です。攻刃のような攻撃力倍率とは異なり、多段攻撃では適用単位によって価値が大きく変わる場合があります。</p>`,
'追撃':`<div class="remember"><b>覚える：通常攻撃などに追加ダメージを発生させる。</b></div><p>追撃は元の攻撃とは別に追加ダメージを発生させる効果です。追撃には複数の種類があり、同時に発動できる組み合わせと共存しない組み合わせがあります。</p>`,
'硬直':`<div class="remember"><b>覚える：大ダメージ＝実時間で最速、ではない。</b></div><p>攻撃後などに次の行動へ移るまで発生する待ち時間を俗に硬直と呼びます。周回速度ではダメージ量だけでなく、演出・操作数・硬直まで含めて考えます。</p>`,
'DPS':`<div class="remember"><b>覚える：DPS＝実時間あたりのダメージ。</b></div><p>Damage Per Secondの考え方で、実際に経過した時間に対してどれだけダメージを出せるかを見る指標です。高速周回ではDPTよりDPSが重要になる場面があります。</p>`,
'DPT':`<div class="remember"><b>覚える：DPT＝1ターンあたりのダメージ。</b></div><p>Damage Per Turnの考え方です。1ターンで大きなダメージを出せても、操作や演出に時間がかかればDPSでは不利になる場合があります。</p>`,
'予兆':`<div class="remember"><b>覚える：V2で敵の特殊行動と解除条件を事前確認する。</b></div><p>バトルシステムVer.2では、敵の特殊技に予兆が表示され、解除条件が設定される場合があります。条件を満たして解除するか、ガードや防御手段で受けるかを判断します。</p>`,
'ディスペル':`<div class="remember"><b>覚える：敵の強化効果を消す。</b></div><p>ディスペルは敵に付与された強化効果を解除する効果の通称です。高難度やフルオートでは、敵がどのタイミングで強化効果を付けるかと合わせて編成します。</p>`,
'クリア':`<div class="remember"><b>覚える：味方の弱体効果を回復する。</b></div><p>クリアは味方に付与された弱体効果を回復する効果の通称です。すべての弱体効果を必ず消せるわけではなく、回復不可の効果などもあります。</p>`,
'フルオ':`<div class="remember"><b>覚える：フルオート＝設定に従って自動戦闘。</b></div><p>フルオートではアビリティや奥義などの設定に従って戦闘が進みます。手動で強い編成と、フルオートで安定する編成は一致しない場合があります。</p>`,
'青箱':`<div class="remember"><b>覚える：青箱の条件はマルチごとに確認する。</b></div><p>一部のマルチバトルにある特別報酬です。必要な貢献度や抽選方式などはバトルごとに異なるため、「青箱は一律○○貢献度」とは考えません。</p>`
};

const lessonRich=[
{t:'火力はどう決まる？',lv:'基礎',remember:'攻撃力を土台に、複数の火力枠を組み合わせる。',body:`<p>まずキャラ・武器・召喚石などから攻撃力の土台が作られます。その上に、通常攻刃・方陣攻刃・EX攻刃などの武器スキル、属性側の補正、HP依存の渾身・背水などが関わります。</p><div class="explain"><b>基本の考え方</b><br>同じ攻刃枠はその枠の中で合計し、通常・方陣・EXのような異なる主要枠は掛け合わせます。そのため、表示攻撃力が高い武器へ入れ替えただけでは最終的な火力が上がるとは限りません。</div><div class="exampleBox"><b>実ダメージではさらに</b><br>有利属性などの属性補正、敵防御、クリティカル、与ダメージ上昇、ダメージ上限などが関係します。つまり「編成の攻撃力」と「敵を殴った最終ダメージ」は別段階です。</div>`},
{t:'武器スキルはどう見る？',lv:'基礎',remember:'効果・枠・SLv・加護対象を見る。',body:`<p>武器はステータスだけでなくスキルが重要です。まず攻刃・守護・技巧・渾身など「何が上がるか」を確認し、次に通常系・方陣系・EX系など「どの計算枠か」を見ます。</p><div class="explain"><b>SLv</b><br>多くの武器スキルはSLvによって効果量が変わります。一方、EXスキルのように通常の武器スキルとは別に付与され、通常のSLvを上げても効果量が変わらないものもあります。</div><div class="exampleBox"><b>武器交換では</b><br>攻刃だけでなく、武器自身の攻撃力・HP、守護、技巧、上限、与ダメージなど「失うもの」と「増えるもの」をまとめて比較します。</div>`},
{t:'召喚石の加護って何？',lv:'基礎',remember:'「何％」より「何を強化するか」が重要。',body:`<p>召喚石の加護には、方陣スキルを強化するマグナ系、通常系スキルを強化する神石系、属性攻撃力を上げるものなどがあります。</p><div class="explain"><b>武器スキル強化型</b><br>たとえば方陣スキル効果UPの加護なら、方陣攻刃だけでなく対象となる方陣系スキルの効果量を増幅します。通常系やEX系まで同じ％増えるわけではありません。</div><div class="exampleBox"><b>メイン＋サポーター</b><br>両方を同系統のスキル加護にする「両面」と、片方を属性加護などにする「片面」では、武器スキルと属性側の倍率配分が変わります。どちらが有利かは編成と目的で変わります。</div>`},
{t:'HPは火力に関係する？',lv:'基礎',remember:'渾身は高HP、背水は低HPで火力が変わる。',body:`<p>通常の攻刃だけなら、現在HPが減ったから攻刃そのものが弱くなるわけではありません。しかし渾身・背水のようなHP依存スキルがあると、残りHP割合が火力に直接関係します。</p><div class="explain"><b>最大HPと現在HP割合は別</b><br>守護などで最大HPを増やすことと、現在HPが最大HPの何％残っているかは別の情報です。渾身・背水を比較するには現在HP割合が必要です。</div>`},
{t:'ダメージ上限とは？',lv:'中級',remember:'上限付近では、攻撃力だけ増やしても伸びにくい。',body:`<p>通常攻撃・奥義・アビリティなどには、一定以上のダメージから伸びが鈍くなる上限側の仕組みがあります。十分な基礎火力がある編成では、攻刃をさらに増やすより上限UPや与ダメージ上昇が重要になる場合があります。</p><div class="explain"><b>全部同じ上限ではない</b><br>通常攻撃・奥義・アビリティにはそれぞれ関連する上限効果があり、一般的なダメージ上限UPのほか、対象を限定した上限UPや特殊上限に関係する効果もあります。</div>`},
{t:'DPTとDPSの違い',lv:'中級',remember:'1ターンの強さと、実時間の速さは別。',body:`<p>DPTは1ターンあたりのダメージ、DPSは実時間あたりのダメージを見る考え方です。</p><div class="exampleBox"><b>例</b><br>奥義で1ターン1000万出る編成より、通常攻撃だけで1ターン700万でも演出・操作・硬直が短ければ、周回では後者の方が速いことがあります。</div><p>古戦場や素材周回では、必要ターン数だけでなく1周に何秒かかるかまで見ると編成を比較しやすくなります。</p>`}
];

function render(searchQ=''){nav();const a=document.querySelector('#app');
if(tab==='home'){
 const chips=recent.length?`<div class="muted" style="margin-top:11px;font-weight:800">最近検索したもの</div><div class="recent">${recent.map(x=>`<button class="chip" data-r="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:'';
 a.innerHTML=`<section><div class="homeSearch"><input id="homeSearchInput" placeholder="用語・Lessonを検索"></div>${chips}<div class="grid" style="margin-top:20px"><button class="card blue" onclick="tab='terms';render()"><b>📖 用語</b><span>用語を調べる</span></button><button class="card green" onclick="tab='learn';render()"><b>📚 学ぶ</b><span>Lessonで理解する</span></button><button class="card purple" onclick="tab='calc';render()"><b>🧮 計算</b><span>編成を数値で比較</span></button><button class="card pink" onclick="tab='fav';render()"><b>⭐ 保存</b><span>${fav.length}件保存中</span></button></div></section>`;
 const inp=document.querySelector('#homeSearchInput');inp.onkeydown=e=>{if(e.key==='Enter')doSearch(inp.value)};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>doSearch(b.dataset.r));
}
if(tab==='terms'){
 if(termOpen!==null){let x=terms[termOpen];a.innerHTML=`<section><button class="smallbtn" onclick="termOpen=null;render()">← 用語一覧</button><div class="termDetail"><div class="tag">${x[2]}</div><h2>${x[0]} <button class="star" onclick="toggleFav('term:${x[0]}')">${fav.includes('term:'+x[0])?'★':'☆'}</button></h2><p class="lead">${x[1]}</p>${termDetail[x[0]]||`<p>${x[1]}</p>`}</div></section>`}
 else {let f=terms.map((x,i)=>[x,i]).filter(([x])=>x.join(' ').toLowerCase().includes(searchQ.toLowerCase()));a.innerHTML=`<section><div class="homeSearch"><input id="termSearch" placeholder="例：加護、硬直、青箱…" value="${esc(searchQ)}"></div><h2 style="margin-top:18px">用語</h2>${searchQ&&!f.length?'<div class="empty">該当する用語がありません</div>':f.map(([x,i])=>`<button class="lessonCard" onclick="termOpen=${i};render()"><span>${x[2]}</span><b>${x[0]}</b><span>${x[1]}</span><i class="arrow">›</i></button>`).join('')}</section>`;let inp=document.querySelector('#termSearch');inp.oninput=()=>render(inp.value);inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
}
if(tab==='learn'){
 if(lessonOpen===null)a.innerHTML=`<section><h2>学ぶ</h2><div class="lessonNote"><b>Lessonについて</b><br>青い「覚える」は最低限の要点だけ。その下で理由・計算上の位置・具体例まで説明します。</div><div class="lessonList">${lessonRich.map((x,i)=>`<button class="lessonCard" onclick="lessonOpen=${i};render()"><span>LESSON ${i+1} ・ ${x.lv}</span><b>${x.t}</b><span>タップして内容を見る</span><i class="arrow">›</i></button>`).join('')}</div></section>`;
 else {let x=lessonRich[lessonOpen];a.innerHTML=`<section><button class="smallbtn" onclick="lessonOpen=null;render()">← Lesson一覧</button><div class="detailHero" style="margin-top:13px"><div class="eyebrow">LESSON ${lessonOpen+1} ・ ${x.lv}</div><h2>${x.t} <button class="star" onclick="toggleFav('lesson:${lessonOpen}')">${fav.includes('lesson:'+lessonOpen)?'★':'☆'}</button></h2><div class="remember"><b>覚える：${x.remember}</b></div></div>${x.body}</section>`}
}
if(tab==='calc')renderCalc(a);
if(tab==='fav'){let items=fav.map(id=>{if(id.startsWith('term:')){let n=id.slice(5),i=terms.findIndex(t=>t[0]===n),x=terms[i];return x?`<button class="lessonCard" onclick="tab='terms';termOpen=${i};render()"><span>用語</span><b>${x[0]}</b><span>${x[1]}</span><i class="arrow">›</i></button>`:''}if(id.startsWith('lesson:')){let i=+id.slice(7),x=lessonRich[i];return x?`<button class="lessonCard" onclick="tab='learn';lessonOpen=${i};render()"><span>LESSON ${i+1}</span><b>${x.t}</b><i class="arrow">›</i></button>`:''}return''}).join('');a.innerHTML=`<section><h2>⭐ 保存</h2>${items||'<div class="empty">まだ保存はありません。</div>'}</section>`}
}
let weaponCount=1;
const skillTypes=['なし','通常攻刃','方陣攻刃','EX攻刃','通常守護','方陣守護','EX守護','通常神威','方陣神威','通常渾身','方陣渾身','通常背水','方陣背水','通常技巧','方陣技巧','ダメージ上限UP','与ダメージ上昇','その他'];
const auraTypes=['なし','通常スキル効果UP','方陣スキル効果UP','属性攻撃力UP','キャラ攻撃力UP','最大HPUP','最大HPDOWN','最大HP固定','与ダメージ上昇','ダメージ上限UP','その他'];
function skillRow(){return `<div class="skillrow"><select class="stype">${skillTypes.map(x=>`<option>${x}</option>`).join('')}</select><select class="ssize"><option>小</option><option>中</option><option selected>大</option><option>特大</option><option>極大</option><option>Ⅱ/Ⅲ</option></select><input class="sval" inputmode="decimal" placeholder="効果%"><input class="slv" inputmode="numeric" placeholder="SLv"></div>`}
function weaponCard(i){return `<div class="weapon"><div class="weaponHead"><h4>⚔️ 武器 ${i}</h4><span class="muted">最大5スキル</span></div><div class="row"><div class="field"><label>武器の攻撃力</label><input class="weaponAtk" inputmode="numeric" placeholder="例 3200"></div><div class="field"><label>武器のHP</label><input class="weaponHp" inputmode="numeric" placeholder="例 280"></div></div><div class="skills">${skillRow()}</div><button class="smallbtn addSkill" style="margin-top:9px">＋ スキル追加</button></div>`}
function auraRow(){return `<div class="skillrow auraRow"><select class="atype">${auraTypes.map(x=>`<option>${x}</option>`).join('')}</select><select class="atarget"><option>全属性</option><option>火</option><option>水</option><option>土</option><option>風</option><option>光</option><option>闇</option></select><input class="aval" inputmode="decimal" placeholder="数値"><input class="acond" placeholder="条件"></div>`}
function summonCard(title,cls,withStats=true){return `<div class="weapon ${cls}"><div class="weaponHead"><h4>${title}</h4><span class="muted">最大5効果</span></div>${withStats?`<div class="row"><div class="field"><label>攻撃力</label><input class="summonAtk" inputmode="numeric"></div><div class="field"><label>HP</label><input class="summonHp" inputmode="numeric"></div></div>`:''}<div class="auras">${auraRow()}</div><button class="smallbtn addAura" style="margin-top:9px">＋ 加護効果を追加</button></div>`}
function renderCalc(a){a.innerHTML=`<section><h2>🧮 編成・火力計算</h2><p class="lead">武器名ではなく、キャラ本人の基礎値＋武器/召喚石の数値＋スキル/加護で比較します。</p>
<div class="calcNotice"><b>入力方法を修正</b><br>最上部は<b>キャラ本人の基礎攻撃力・基礎HP</b>です。武器と召喚石の攻撃力/HPは下で個別に入力して加算します。</div>
<div class="calcTop"><div class="eyebrow">STEP 1　キャラ本人</div><div class="row"><div class="field"><label>キャラ基礎攻撃力</label><input id="baseAtk" inputmode="numeric" placeholder="装備分を含めない値"></div><div class="field"><label>キャラ基礎HP</label><input id="baseHp" inputmode="numeric" placeholder="装備分を含めない値"></div></div><div class="field"><label>現在HP割合（渾身・背水用）</label><input id="hpp" type="range" min="1" max="100" value="100"><div id="hppv" class="muted">100%</div></div></div>
<div class="sectionTitle"><h3>STEP 2　武器</h3><span class="muted">最大10本・1本5スキル</span></div><div id="weapons">${weaponCard(1)}</div><button id="addWeapon" class="addbtn">＋ 武器を追加</button>
<div class="sectionTitle"><h3>STEP 3　召喚石</h3></div>${summonCard('🔮 メイン召喚石','mainSummon',true)}${summonCard('🤝 サポーター召喚石','supportSummon',false)}
<div id="normalSubs">${summonCard('💎 通常サブ石 1','normalSub',true)}</div><button id="addSub" class="addbtn">＋ 通常サブ石を追加（最大4）</button>
<div class="calcNotice"><b>サブ加護専用枠</b><br>この2枠は攻撃力・HPを加算せず、サブ加護だけを反映します。</div>${summonCard('✨ サブ加護枠 1','subAuraOnly',false)}${summonCard('✨ サブ加護枠 2','subAuraOnly',false)}
<button id="calcBtn" class="primary" style="width:100%;margin-top:14px">計算する</button><div id="calcResult"></div></section>`;
const range=document.querySelector('#hpp');range.oninput=()=>document.querySelector('#hppv').textContent=range.value+'%';bindCalcButtons();document.querySelector('#addWeapon').onclick=()=>{if(weaponCount>=10)return;weaponCount++;document.querySelector('#weapons').insertAdjacentHTML('beforeend',weaponCard(weaponCount));bindCalcButtons()};let subCount=1;document.querySelector('#addSub').onclick=()=>{if(subCount>=4)return;subCount++;document.querySelector('#normalSubs').insertAdjacentHTML('beforeend',summonCard('💎 通常サブ石 '+subCount,'normalSub',true));bindCalcButtons()};document.querySelector('#calcBtn').onclick=calcNow}
function bindCalcButtons(){document.querySelectorAll('.addSkill').forEach(b=>b.onclick=()=>{let box=b.parentElement.querySelector('.skills');if(box.children.length<5)box.insertAdjacentHTML('beforeend',skillRow())});document.querySelectorAll('.addAura').forEach(b=>b.onclick=()=>{let box=b.parentElement.querySelector('.auras');if(box.children.length<5)box.insertAdjacentHTML('beforeend',auraRow())})}
function nval(el){return parseFloat(el?.value)||0}
function baseEffect(t,s,L,m){if(m>0)return m/100;L=L||20;let T={'通常攻刃':{'小':[.10,.12,.13],'中':[.12,.145,.16],'大':[.15,.18,.20]},'方陣攻刃':{'小':[.10,.12,.13],'中':[.12,.145,.16],'大':[.15,.18,.20]},'通常守護':{'小':[.12,.14,.16],'中':[.15,.17,.17],'大':[.18,.21,.24]},'方陣守護':{'小':[.10,.12,.13],'中':[.15,.18,.20]},'通常神威':{'小':[.10,.12,.125],'中':[.12,.145,.155],'大':[.15,.18,.20]},'方陣神威':{'小':[.10,.12,.125],'中':[.12,.145,.155]}};let x=T[t]?.[s];if(!x)return 0;return L>=20?x[2]:L>=15?x[1]:x[0]}
function hpEffect(t,s,L,h){let H=h/100;if(t.includes('背水')){let max=s==='小'?(L>=20?.225:L>=15?.21:.18):s==='中'?(L>=20?.33:L>=15?.30:.24):(L>=20?.405:L>=15?.375:.30);return H>=1?0:max*(1-H)*(1.2-.2*H)}if(t.includes('渾身')){if(H<.25)return 0;let top=s==='中'?(L>=15?.1197:.0939):(L>=20?.1699:L>=15?.15:.1137);return top*Math.pow((H-.15)/.85,2.2)}return 0}
function collectAuras(){let o={normalAura:0,magnaAura:0,elemental:0,charAtk:0,hpUp:0,hpDown:0,hpFixed:null,flat:0,unsupported:[]};document.querySelectorAll('.auraRow').forEach(r=>{let t=r.querySelector('.atype').value,v=nval(r.querySelector('.aval'));if(t==='通常スキル効果UP')o.normalAura+=v/100;else if(t==='方陣スキル効果UP')o.magnaAura+=v/100;else if(t==='属性攻撃力UP')o.elemental+=v/100;else if(t==='キャラ攻撃力UP')o.charAtk+=v/100;else if(t==='最大HPUP')o.hpUp+=v/100;else if(t==='最大HPDOWN')o.hpDown+=v/100;else if(t==='最大HP固定')o.hpFixed=v||o.hpFixed;else if(t==='与ダメージ上昇')o.flat+=v;else if(t!=='なし')o.unsupported.push(t)});return o}
function calcNow(){let baseAtk=nval(document.querySelector('#baseAtk')),baseHp=nval(document.querySelector('#baseHp')),hpp=nval(document.querySelector('#hpp'))||100,weaponAtk=0,weaponHp=0,summonAtk=0,summonHp=0;document.querySelectorAll('.weaponAtk').forEach(x=>weaponAtk+=nval(x));document.querySelectorAll('.weaponHp').forEach(x=>weaponHp+=nval(x));document.querySelectorAll('.summonAtk').forEach(x=>summonAtk+=nval(x));document.querySelectorAll('.summonHp').forEach(x=>summonHp+=nval(x));let a=collectAuras(),normal=0,magna=0,ex=0,hpSkill=0,unsupported=[];document.querySelectorAll('.skillrow:not(.auraRow)').forEach(r=>{let t=r.querySelector('.stype').value,s=r.querySelector('.ssize').value,m=nval(r.querySelector('.sval')),L=nval(r.querySelector('.slv'))||20,v=baseEffect(t,s,L,m);if(t==='通常攻刃')normal+=v*(1+a.normalAura);else if(t==='方陣攻刃')magna+=v*(1+a.magnaAura);else if(t==='EX攻刃')ex+=v;else if(t==='通常神威'){normal+=v*(1+a.normalAura);hpSkill+=v*(1+a.normalAura)}else if(t==='方陣神威'){magna+=v*(1+a.magnaAura);hpSkill+=v*(1+a.magnaAura)}else if(t==='通常守護')hpSkill+=v*(1+a.normalAura);else if(t==='方陣守護')hpSkill+=v*(1+a.magnaAura);else if(t==='EX守護')hpSkill+=v;else if(t==='通常渾身')normal+=hpEffect(t,s,L,hpp)*(1+a.normalAura);else if(t==='方陣渾身')magna+=hpEffect(t,s,L,hpp)*(1+a.magnaAura);else if(t==='通常背水')normal+=hpEffect(t,s,L,hpp)*(1+a.normalAura);else if(t==='方陣背水')magna+=hpEffect(t,s,L,hpp)*(1+a.magnaAura);else if(t!=='なし')unsupported.push(t)});let rawAtk=baseAtk+weaponAtk+summonAtk,rawHp=baseHp+weaponHp+summonHp;hpSkill=Math.min(hpSkill,4);let finalHp=a.hpFixed!==null?a.hpFixed:Math.max(1,Math.round(rawHp*(1+hpSkill+a.hpUp-a.hpDown)));let mult=(1+normal+a.charAtk)*(1+magna)*(1+ex)*(1+a.elemental),power=Math.round(rawAtk*mult),candidate=[['通常攻刃',normal],['方陣攻刃',magna],['EX攻刃',ex]].sort((x,y)=>x[1]-y[1])[0],notes=[...new Set([...unsupported,...a.unsupported])];document.querySelector('#calcResult').innerHTML=`<div class="resultBox"><div class="eyebrow" style="color:#8ed7e4">計算結果</div><div class="compareGrid" style="margin-top:10px"><div class="metric"><span class="tiny" style="color:#bfd0df">装備込み基礎攻撃力</span><b>${Math.round(rawAtk).toLocaleString()}</b></div><div class="metric"><span class="tiny" style="color:#bfd0df">推定最大HP</span><b>${finalHp.toLocaleString()}</b></div><div class="metric"><span class="tiny" style="color:#bfd0df">攻撃力指標</span><b>${power.toLocaleString()}</b></div><div class="metric"><span class="tiny" style="color:#bfd0df">現在HP</span><b>${Math.round(finalHp*hpp/100).toLocaleString()} (${hpp}%)</b></div></div><div class="bars"><div class="bar">通常系 ${(normal*100).toFixed(1)}% / 加護 ${(a.normalAura*100).toFixed(0)}%</div><div class="bar">方陣系 ${(magna*100).toFixed(1)}% / 加護 ${(a.magnaAura*100).toFixed(0)}%</div><div class="bar">EX ${(ex*100).toFixed(1)}% / 属性 ${(a.elemental*100).toFixed(0)}%</div><div class="bar">HPスキル ${(hpSkill*100).toFixed(1)}%</div></div><div class="swap"><b>🔁 入れ替え候補</b><p class="muted">主要3枠では <b>${candidate[0]}</b> が薄め。火力優先なら、守護系などを減らしてこの枠を増やす比較候補になります。</p><div><span class="down">守護系</span> → <span class="up">${candidate[0]}</span></div></div>${a.flat?`<div class="swap"><b>＋ 与ダメージ上昇</b><p class="muted">${Math.round(a.flat).toLocaleString()} を別枠表示。攻撃力指標には混ぜていません。</p></div>`:''}${notes.length?`<div class="swap"><b>⚠️ 未完全対応</b><p class="muted">${notes.join('、')} は誤計算防止のため指標へ未反映です。</p></div>`:''}<p class="tiny" style="color:#bfd0df;margin-top:12px">これは編成比較用の攻撃力指標。敵防御・クリティカル・上限・追撃などを含む最終ダメージそのものではありません。</p></div>`}

render();
</script></body></html>
