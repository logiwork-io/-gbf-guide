x;margin-bottom:6px}.card span,.lessonCard span{color:#718096;font-size:12px;line-height:1.5}.card.blue{border-top:4px solid #3699e6}.card.green{border-top:4px solid #27ad83}.card.orange{border-top:4px solid #f0a13b}.card.pink{border-top:4px solid #dd6f9d}.card.purple{border-top:4px solid #8b72db}.card.yellow{border-top:4px solid #e8b735}.recent{display:flex;gap:8px;overflow:auto;padding:3px 0 5px}.chip{border:1px solid #dce5ee;background:#f6f9fc;border-radius:999px;padding:8px 11px;white-space:nowrap;color:#516077;font-size:12px}.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin:24px 0 11px}.sectionTitle h2,.sectionTitle h3{margin:0}.term{padding:18px 0;border-bottom:1px solid #e8edf3}.term h3{margin:5px 0 8px;font-size:20px}.term p,.detail p,.diag p{margin:0;color:#536176;line-height:1.8}.tag{font-size:11px;color:#0d8ca1;font-weight:900}.star{float:right;background:#fff8db;border:1px solid #f1df8d;border-radius:9px;color:#d49a00;font-size:18px;padding:4px 8px}.lessonList{display:grid;gap:11px}.lessonCard{width:100%;border-left:5px solid #3c9fe4}.lessonCard:nth-child(2n){border-left-color:#25aa83}.lessonCard:nth-child(3n){border-left-color:#ef9a38}.arrow{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#9aa7b7;font-size:22px}.detailHero{padding:20px;border-radius:18px;background:linear-gradient(135deg,#edf9ff,#fff8ea);border:1px solid #d9e8f1}.detailHero h2{margin:6px 0 10px}.keybox{margin-top:15px;background:#fff;border-radius:14px;padding:15px;border:1px solid #dce6ef}.keyrow{display:flex;gap:10px;align-items:flex-start;margin:8px 0;line-height:1.55}.dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}.c1{background:#e45c5c}.c2{background:#1f9fbe}.c3{background:#e7a62f}.c4{background:#3ca978}.info{margin-top:14px;padding:16px;border-radius:14px;background:#f6f8fb;border-left:5px solid #7487a0}.info.warn{background:#fff8e8;border-left-color:#e8a52e}.info.good{background:#edf9f4;border-left-color:#35 3px 0}.tiny{font-size:11px;color:#7b8798;line-height:1.55}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{padding:11px;border-radius:11px;background:#ffffff18}.metric b{display:block;font-size:18px;margin-top:3px}.up{color:#16805f;font-weight:900}.down{color:#c55d42;font-weight:900}.muted{color:#718096;font-size:12px;line-height:1.6}.empty{padding:25px;text-align:center;color:#7b8798;background:#f7f9fb;border-radius:14px}footer{text-align:center;color:#8c98a8;font-size:11px;padding:35px 20px}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.skillrow{grid-template-columns:1.25fr .8fr .65fr}h1{font-size:25px}}

</style></head><body><main><header><b>GRANBLUE GUIDE</b><h1>グラブル攻略ノート</h1><p>調べる・学ぶ・診断する・計算する。</p><div class="homeSearch"><input id="globalSearch" placeholder="用語・Lesson・悩みを検索"></div><div id="recentHead"></div></header><nav id="nav"></nav><div id="app"></div><footer>グラブル攻略ノート / β版</footer></main><script>
const terms=[['攻刃','武器スキルなどによる攻撃力上昇の代表的な仕組み。通常・方陣・EXなど異なる枠がある。','火力'],['方陣攻刃','主にマグナ系武器が持つ攻刃。対応するマグナ加護で効果量が強化される。','火力'],['EX攻刃','通常・方陣とは別系統の攻刃枠。基本的にマグナ・神石加護の対象外。','火力'],['加護','メイン召喚石やサポーター召喚石などが持つ編成強化効果。対象武器スキルを増幅するものもある。','召喚石'],['渾身','HPが高いほど攻撃性能が高くなる効果。現在HP割合が重要。','火力'],['背水','HPが低いほど攻撃性能が高くなる効果。現在HP割合が重要。','火力'],['守護','最大HPを上昇させる武器スキル。系統によって加護対象が異なる。','耐久'],['技巧','クリティカル発動率に関係する武器スキル。','火力'],['ダメージ上限','攻撃力を上げ続けてもダメージが同じ割合では伸びなくなる領域に関係する仕組み。','火力'],['与ダメージ上昇','条件を満たす攻撃のダメージに加算を行うタイプの効果。攻撃UPや上限UPとは別物。','火力'],['追撃','通常攻撃などに追加して発生するダメージ。種類によって共存可否が異なる。','戦闘'],['硬直','攻撃後などに次の攻撃操作へ移れない待ち時間。高速周回では重要。','速度'],['DPS','実時間あたりにどれだけダメージを出せるかを見る考え方。','速度'],['DPT','1ターンあたりのダメージを見る考え方。','速度'],['予兆','バトルシステムVer.2で敵の特殊技と解除条件などを事前表示する仕組み。','V2'],['ディスペル','敵の強化効果を消去する効果。','戦闘'],['クリア','味方の弱体効果を回復する効果。','戦闘'],['フルオ','フルオートの略。設定に従って自動で戦闘を進める。','戦闘'],['青箱','一部マルチに存在する特別報酬。獲得条件や仕組みはバトルごとに異なる。','マルチ']];
const lessons=[
{t:'火力はどう決まる？',lv:'基礎',keys:['表示攻撃力だけでは最終ダメージは決まらない','同じ攻刃枠は足し算、別の主要枠は掛け算が基本','渾身・背水があると現在HPも重要','上限付近では攻撃力以外を伸ばす必要がある'],body:'通常攻刃・方陣攻刃・EX攻刃などは、同じ枠をまとめたうえで別枠同士を乗算して考えるのが基本です。実ダメージではさらに属性、敵防御、クリティカル、与ダメ、上限などが関係します。'},
{t:'加護って何を強くする？',lv:'基礎',keys:['加護＝最終ダメージをその％だけ増やす、ではない','マグナ加護は対応する方陣スキルを強化','神石加護は対応する通常系スキルを強化','メインとサポーターの組み合わせで効果量が変わる'],body:'加護文に書かれた対象スキルの効果量を増幅するタイプがあります。武器スキル名と加護の対象が一致しているか確認するのが重要です。'},
{t:'片面と両面の考え方',lv:'中級',keys:['両面は対象スキルへの加護量を確保しやすい','片面はもう片方に別タイプの加護を置ける','どちらが強いかは武器構成と目的次第'],body:'片面・両面は単純な上下関係ではありません。技巧、渾身、HP、上限など編成が必要とする要素を見て決めます。'},
{t:'上限・与ダメ・攻撃UPの違い',lv:'中級',keys:['攻撃UP＝上限そのものを上げる効果ではない','上限UP＝上限付近で重要','与ダメ上昇＝攻撃UPとは別の加算要素','今どこが不足しているかで優先度が変わる'],body:'火力が伸びない時は「攻撃力不足」なのか「上限に近い」のかを切り分けます。同じ火力要素でも役割が違います。'},
{t:'表示ダメージと速度は別',lv:'中級',keys:['1ターン最大ダメージ＝最速ではない','演出・操作数・硬直が実時間に影響','DPTとDPSは分けて考える'],body:'周回では大きな数字だけでなく、1周に必要な時間まで含めて考える必要があります。'}];
let tab='home',step=0,help=false,lessonOpen=null;let fav=JSON.parse(localStorage.getItem('gbfFav2')||'[]');let recent=JSON.parse(localStorage.getItem('gbfRecent')||'[]');const tabs=[['home','ホーム'],['terms','用語'],['learn','学ぶ'],['diagnose','診断'],['calc','計算'],['fav','★保存']];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function saveRecent(s){s=s.trim();if(!s)return;recent=[s,...recent.filter(x=>x!==s)].slice(0,6);localStorage.setItem('gbfRecent',JSON.stringify(recent));renderRecent()}
function renderRecent(){let el=document.querySelector('#recentHead');el.innerHTML=recent.length?`<div class="muted" style="margin-top:11px;font-weight:800">最近検索したもの</div><div class="recent">${recent.map(x=>`<button class="chip" data-r="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:'';el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>doSearch(b.dataset.r))}
function doSearch(q){saveRecent(q);tab='terms';render(q)}
function nav(){document.querySelector('#nav').innerHTML=tabs.map(x=>`<button class="${tab===x[0]?'on':''}" data-tab="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;lessonOpen=null;help=false;render()})}
function toggleFav(id){fav=fav.includes(id)?fav.filter(v=>v!==id):[...fav,id];localStorage.setItem('gbfFav2',JSON.stringify(fav));render()}
function render(searchQ=''){nav();renderRecent();const a=document.querySelector('#app');
if(tab==='home')a.innerHTML=`<section><div class="hero"><div class="eyebrow"></div><h2>知りたいことへ、すぐ辿り着く。</h2><p>用語を調べるだけでなく、仕組みを理解して、困った時は診断。編成は計算で比較できます。</p></div><div class="sectionTitle"><h3>メニュー</h3></div><div class="grid"><button class="card blue" onclick="tab='terms';render()"><b>📖 用語集</b><span>攻略用語を検索</span></button><button class="card green" onclick="tab='learn';render()"><b>📚 学ぶ</b><span>Lesson形式で理解</span></button><button class="card orange" onclick="tab='diagnose';render()"><b>🩺 診断</b><span>YES / NOで原因確認</span></button><button class="card purple" onclick="tab='calc';render()"><b>🧮 火力計算</b><span>数値＋スキルで比較</span></button><button class="card pink" onclick="tab='fav';render()"><b>⭐ 保存</b><span>${fav.length}件保存中</span></button><button class="card yellow" onclick="tab='learn';render()"><b>🛠️ 改善する</b><span>弱点から改善策へ</span></button></div></section>`;
if(tab==='terms'){let f=terms.filter(x=>x.join(' ').toLowerCase().includes(searchQ.toLowerCase()));a.innerHTML=`<section><h2>用語集</h2><div class="homeSearch"><input id="termSearch" placeholder="例：加護、硬直、青箱…" value="${esc(searchQ)}"></div>${searchQ&&!f.length?'<div class="empty">該当する用語がありません</div>':f.map(x=>`<article class="term"><div class="tag">${x[2]}</div><h3>${x[0]} <button class="star" onclick="toggleFav('term:${x[0]}')">${fav.includes('term:'+x[0])?'★':'☆'}</button></h3><p>${x[1]}</p></article>`).join('')}</section>`;let inp=document.querySelector('#termSearch');inp.onkeydown=e=>{if(e.key==='Enter'){saveRecent(inp.value);render(inp.value)}}}
if(tab==='learn'){if(lessonOpen===null)a.innerHTML=`<section><h2>学ぶ</h2><p class="lead">気になるLessonをタップすると、要点→詳しい説明の順で開きます。</p><div class="lessonList" style="margin-top:16px">${lessons.map((x,i)=>`<button class="lessonCard" onclick="lessonOpen=${i};render()"><span>LESSON ${i+1} ・ ${x.lv}</span><b>${x.t}</b><span>タップして内容を見る</span><i class="arrow">›</i></button>`).join('')}</div></section>`;else{let x=lessons[lessonOpen];a.innerHTML=`<section><button class="smallbtn" onclick="lessonOpen=null;render()">← Lesson一覧</button><div class="detailHero" style="margin-top:13px"><div class="eyebrow">LESSON ${lessonOpen+1} ・ ${x.lv}</div><h2>${x.t} <button class="star" onclick="toggleFav('lesson:${lessonOpen}')">${fav.includes('lesson:'+lessonOpen)?'★':'☆'}</button></h2><div class="keybox"><b>ここだけ先に覚える</b>${x.keys.map((k,i)=>`<div class="keyrow"><i class="dot c${i+1}"></i><span>${k}</span></div>`).join('')}</div></div><div class="info"><b>詳しく</b><p>${x.body}</p></div><div class="info warn"><b>注意</b><p>このLessonでは考え方を優先しています。実ダメージは敵防御・属性・上限・各種特殊効果などでも変化します。</p></div></section>`}}
if(tab==='diagnose'){const qs=[['① 有利属性で戦っている？','まず敵属性と自分の編成属性を確認します。','属性相性を確認','有利属性でない場合、属性補正などの違いで想定よりダメージが出ないことがあります。'],['② 武器のスキルLvは十分？','武器LvとスキルLvは別です。','スキルLvを確認','主力武器のスキルLvを確認します。スキル効果量が育っていないと、武器を並べても十分に効果を得られません。'],['③ 加護と武器スキルが合っている？','加護の対象と武器スキルを照合します。','加護を確認','マグナ加護・神石加護などは対象スキルが決まっています。「加護」のLessonで対象の見方を確認できます。'],['④ どの火力が弱い？','通常・奥義・アビ・実時間速度で改善方法が変わります。','次の診断へ','ここから通常攻撃・奥義・アビダメ・速度に分岐します。']];let x=qs[step];a.innerHTML=`<section><h2>🩺 火力が出ない</h2><p class="lead">一つずつ確認して原因を切り分けます。</p><div class="diag" style="margin-top:15px"><div class="eyebrow">STEP ${step+1} / ${qs.length}</div><h3>${x[0]}</h3><p>${x[1]}</p>${help?`<div class="help"><b>${x[2]}</b><p>${x[3]}</p></div><button class="back" onclick="help=false;render()">← 診断に戻る</button><button class="yes" onclick="tab='learn';lessonOpen=${step===2?1:0};help=false;render()">関連Lessonを見る</button>`:step<3?`<button class="yes" onclick="step++;render()">YES → 次へ</button><button class="no" onclick="help=true;render()">NO / わからない</button>`:`<div class="info good"><b>基本チェック完了</b><p>次版で通常・奥義・アビ・速度の個別診断へ分岐します。</p></div><button class="back" onclick="step=0;render()">最初から確認</button>`}</div></section>`}
if(tab==='calc')renderCalc(a);
if(tab==='fav'){let items=fav.map(id=>{if(id.startsWith('term:')){let n=id.slice(5),x=terms.find(t=>t[0]===n);return x?`<article class="term"><div class="tag">用語</div><h3>${x[0]}</h3><p>${x[1]}</p></article>`:''}if(id.startsWith('lesson:')){let i=+id.slice(7),x=lessons[i];return x?`<button class="lessonCard" onclick="tab='learn';lessonOpen=${i};render()"><span>LESSON ${i+1}</span><b>${x.t}</b><i class="arrow">›</i></button>`:''}return''}).join('');a.innerHTML=`<section><h2>⭐ 保存</h2>${items||'<div class="empty">まだ保存はありません。用語やLessonの☆を押すとここに残ります。</div>'}</section>`}}

let weaponCount=1;
const skillTypes=['なし','通常攻刃','方陣攻刃','EX攻刃','通常守護','方陣守護','EX守護','通常神威','方陣神威','通常渾身','方陣渾身','通常背水','方陣背水','通常技巧','方陣技巧','ダメージ上限UP','与ダメージ上昇','その他'];
const auraTypes=['なし','通常スキル効果UP','方陣スキル効果UP','属性攻撃力UP','キャラ攻撃力UP','最大HPUP','最大HPDOWN','最大HP固定','与ダメージ上昇','ダメージ上限UP','その他'];
function skillRow(){return `<div class="skillrow"><select class="stype">${skillTypes.map(x=>`<option>${x}</option>`).join('')}</select><select class="ssize"><option>小</option><option>中</option><option selected>大</option><option>特大</option><option>極大</option><option>Ⅱ/Ⅲ</option></select><input class="sval" inputmode="decimal" placeholder="効果%"><input class="slv" inputmode="numeric" placeholder="SLv"></div>`}
function weaponCard(i){return `<div class="weapon"><div class="weaponHead"><h4>⚔️ 武器 ${i}</h4><span class="muted">最大5スキル</span></div><div class="row"><div class="field"><label>武器の攻撃力</label><input class="weaponAtk" inputmode="numeric" placeholder="例 3200"></div><div class="field"><label>武器のHP</label><input class="weaponHp" inputmode="numeric" placeholder="例 280"></div></div><div class="skills">${skillRow()}</div><button class="smallbtn addSkill" style="margin-top:9px">＋ スキル追加</button></div>`}
function auraRow(){return `<div class="skillrow auraRow"><select class="atype">${auraTypes.map(x=>`<option>${x}</option>`).join('')}</select><select class="atarget"><option>全属性</option><option>火</option><option>水</option><option>土</option><option>風</option><option>光</option><option>闇</option></select><input class="aval" inputmode="decimal" placeholder="数値"><input class="acond" placeholder="条件"></div>`}
function summonCard(title,cls,withStats=true){return `<div class="weapon ${cls}"><div class="weaponHead"><h4>${title}</h4><span class="muted">最大5効果</span></div>${withStats?`<div class="row"><div class="field"><label>攻撃力</label><input class="summonAtk" inputmode="numeric"></div><div class="field"><label>HP</label><input class="summonHp" inputmode="numeric"></div></div>`:''}<div class="auras">${auraRow()}</div><button class="smallbtn addAura" style="margin-top:9px">＋ 加護効果を追加</button></div>`}
function renderCalc(a){a.innerHTML=`<section><h2>🧮 編成・火力計算</h2><p class="lead">武器名ではなく、キャラ本人の基礎値＋武器/召喚石の数値＋スキル/加護で比較します。</p>
<div class="calcNotice"><b>入力方法を修正</b><br>最上部は<b>キャラ本人の基礎攻撃力・基礎HP</b>です。武器と召喚石の攻撃力/HPは下で個別に入力して加算します。</div>
<div class="calcTop"><div class="eyebrow">STEP 1　キャラ本人</div><div class="row"><div class="field"><label>キャラ基礎攻撃力</label><input id="baseAtk" inputmode="numeric" placeholder="装備分を含めない値"></div><div class="field"><label>キャラ基礎HP</label><input id="baseHp" inputmode="numeric" placeholder="装備分を含めない値"></div></div><div class="field"><label>現在HP割合（渾身・背水用）</label><input id="hpp" type="range" min="1" max="100" value="100"><div id="hppv" class="muted">100%</div></div></div>
<div class="sectionTitle"><h3>STEP 2　武器</h3><span class="muted">最大10本・1本5スキル</span></div><div id="weapons">${weaponCard(1)}</div><button id="addWeapon" class="addbtn">＋ 武器を追加</button>
<div class="sectionTitle"><h3>STEP 3　召喚石</h3></div>${summonCard('🔮 メイン召喚石','mainSummon',true)}${summonCard('🤝 サポーター召喚石','supportSummon',false)}
<div id="normalSubs">${summonCard('💎 通常サブ石 1','normalSub',true)}</div><button id="addSub" class="addbtn">＋ 通常サブ石を追加（最大4）</button>
<div class="calcNotice"><b>サブ加護専用枠</b><br>この2枠は攻撃力・HPを加算せず、サブ加護だけを反映します。</div>${summonCard('✨ サブ加護枠 1','subAuraOnly',false)}${summonCard('✨ サブ加護枠 2','subAuraOnly',false)}
<button id="calcBtn" class="primary" style="width:100%;margin-top:14px">計算する</button><div id="calcResult"></div></section>`;
const range=document.querySelector('#hpp');range.oninput=()=>document.querySelector('#hppv').textContent=range.value+'%';bindCalcButtons();document.querySelector('#addWeapon').onclick=()=>{if(weaponCount>=10)return;weaponCount++;document.querySelector('#weapons').insertAdjacentHTML('beforeend',weaponCard(weaponCount));bindCalcButtons()};let subCount=1;document.querySelector('#addSub').onclick=()=>{if(subCount>=4)return;subCount++;document.querySelector('#normalSubs').insertAdjacentHTML('beforeend',summonCard('💎 通常サブ石 '+subCount,'normalSub',true));bindCalcButtons()};document.querySelector('#calcBtn').onclick=calcNow}
function bindCalcButtons(){document.querySelectorAll('.addSkill').forEach(b=>b.onclick=()=>{let box=b.parentElement.querySelector('.skills');if(box.children.length<5)box.insertAdjacentHTML('beforeend',skillRow())});document.querySelectorAll('.addAura').forEach(b=>b.onclick=()=>{let box=b.parentElement.querySelector('.auras');if(box.children.length<5)box.insertAdjacentHTML('beforeend',auraRow())})}
function nval(el){return parseFloat(el?.value)||0}
function baseEffect(t,s,L,m){if(m>0)return m/100;L=L||20;let T={'通常攻刃':{'小':[.10,.12,.13],'中':[.12,.145,.16],'大':[.15,.18,.20]},'方陣攻刃':{'小':[.10,.12,.13],'中':[.12,.145,.16],'大':[.15,.18,.20]},'通常守護':{'小':[.12,.14,.16],'中':[.15,.17,.17],'大':[.18,.21,.24]},'方陣守護':{'小':[.10,.12,.13],'中':[.15,.18,.20]},'通常神威':{'小':[.10,.12,.125],'中':[.12,.145,.155],'大':[.15,.18,.20]},'方陣神威':{'小':[.10,.12,.125],'中':[.12,.145,.155]}};let x=T[t]?.[s];if(!x)return 0;return L>=20?x[2]:L>=15?x[1]:x[0]}
function hpEffect(t,s,L,h){let H=h/100;if(t.includes('背水')){let max=s==='小'?(L>=20?.225:L>=15?.21:.18):s==='中'?(L>=20?.33:L>=15?.30:.24):(L>=20?.405:L>=15?.375:.30);return H>=1?0:max*(1-H)*(1.2-.2*H)}if(t.includes('渾身')){if(H<.25)return 0;let top=s==='中'?(L>=15?.1197:.0939):(L>=20?.1699:L>=15?.15:.1137);return top*Math.pow((H-.15)/.85,2.2)}return 0}
function collectAuras(){let o={normalAura:0,magnaAura:0,elemental:0,charAtk:0,hpUp:0,hpDown:0,hpFixed:null,flat:0,unsupported:[]};document.querySelectorAll('.auraRow').forEach(r=>{let t=r.querySelector('.atype').value,v=nval(r.querySelector('.aval'));if(t==='通常スキル効果UP')o.normalAura+=v/100;else if(t==='方陣スキル効果UP')o.magnaAura+=v/100;else if(t==='属性攻撃力UP')o.elemental+=v/100;else if(t==='キャラ攻撃力UP')o.charAtk+=v/100;else if(t==='最大HPUP')o.hpUp+=v/100;else if(t==='最大HPDOWN')o.hpDown+=v/100;else if(t==='最大HP固定')o.hpFixed=v||o.hpFixed;else if(t==='与ダメージ上昇')o.flat+=v;else if(t!=='なし')o.unsupported.push(t)});return o}
function calcNow(){let baseAtk=nval(document.querySelector('#baseAtk')),baseHp=nval(document.querySelector('#baseHp')),hpp=nval(document.querySelector('#hpp'))||100,weaponAtk=0,weaponHp=0,summonAtk=0,summonHp=0;document.querySelectorAll('.weaponAtk').forEach(x=>weaponAtk+=nval(x));document.querySelectorAll('.weaponHp').forEach(x=>weaponHp+=nval(x));document.querySelectorAll('.summonAtk').forEach(x=>summonAtk+=nval(x));document.querySelectorAll('.summonHp').forEach(x=>summonHp+=nval(x));let a=collectAuras(),normal=0,magna=0,ex=0,hpSkill=0,unsupported=[];document.querySelectorAll('.skillrow:not(.auraRow)').forEach(r=>{let t=r.querySelector('.stype').value,s=r.querySelector('.ssize').value,m=nval(r.querySelector('.sval')),L=nval(r.querySelector('.slv'))||20,v=baseEffect(t,s,L,m);if(t==='通常攻刃')normal+=v*(1+a.normalAura);else if(t==='方陣攻刃')magna+=v*(1+a.magnaAura);else if(t==='EX攻刃')ex+=v;else if(t==='通常神威'){normal+=v*(1+a.normalAura);hpSkill+=v*(1+a.normalAura)}else if(t==='方陣神威'){magna+=v*(1+a.magnaAura);hpSkill+=v*(1+a.magnaAura)}else if(t==='通常守護')hpSkill+=v*(1+a.normalAura);else if(t==='方陣守護')hpSkill+=v*(1+a.magnaAura);else if(t==='EX守護')hpSkill+=v;else if(t==='通常渾身')normal+=hpEffect(t,s,L,hpp)*(1+a.normalAura);else if(t==='方陣渾身')magna+=hpEffect(t,s,L,hpp)*(1+a.magnaAura);else if(t==='通常背水')normal+=hpEffect(t,s,L,hpp)*(1+a.normalAura);else if(t==='方陣背水')magna+=hpEffect(t,s,L,hpp)*(1+a.magnaAura);else if(t!=='なし')unsupported.push(t)});let rawAtk=baseAtk+weaponAtk+summonAtk,rawHp=baseHp+weaponHp+summonHp;hpSkill=Math.min(hpSkill,4);let finalHp=a.hpFixed!==null?a.hpFixed:Math.max(1,Math.round(rawHp*(1+hpSkill+a.hpUp-a.hpDown)));let mult=(1+normal+a.charAtk)*(1+magna)*(1+ex)*(1+a.elemental),power=Math.round(rawAtk*mult),candidate=[['通常攻刃',normal],['方陣攻刃',magna],['EX攻刃',ex]].sort((x,y)=>x[1]-y[1])[0],notes=[...new Set([...unsupported,...a.unsupported])];document.querySelector('#calcResult').innerHTML=`<div class="resultBox"><div class="eyebrow" style="color:#8ed7e4">計算結果</div><div class="compareGrid" style="margin-top:10px"><div class="metric"><span class="tiny" style="color:#bfd0df">装備込み基礎攻撃力</span><b>${Math.round(rawAtk).toLocaleString()}</b></div><div class="metric"><span class="tiny" style="color:#bfd0df">推定最大HP</span><b>${finalHp.toLocaleString()}</b></div><div class="metric"><span class="tiny" style="color:#bfd0df">攻撃力指標</span><b>${power.toLocaleString()}</b></div><div class="metric"><span class="tiny" style="color:#bfd0df">現在HP</span><b>${Math.round(finalHp*hpp/100).toLocaleString()} (${hpp}%)</b></div></div><div class="bars"><div class="bar">通常系 ${(normal*100).toFixed(1)}% / 加護 ${(a.normalAura*100).toFixed(0)}%</div><div class="bar">方陣系 ${(magna*100).toFixed(1)}% / 加護 ${(a.magnaAura*100).toFixed(0)}%</div><div class="bar">EX ${(ex*100).toFixed(1)}% / 属性 ${(a.elemental*100).toFixed(0)}%</div><div class="bar">HPスキル ${(hpSkill*100).toFixed(1)}%</div></div><div class="swap"><b>🔁 入れ替え候補</b><p class="muted">主要3枠では <b>${candidate[0]}</b> が薄め。火力優先なら、守護系などを減らしてこの枠を増やす比較候補になります。</p><div><span class="down">守護系</span> → <span class="up">${candidate[0]}</span></div></div>${a.flat?`<div class="swap"><b>＋ 与ダメージ上昇</b><p class="muted">${Math.round(a.flat).toLocaleString()} を別枠表示。攻撃力指標には混ぜていません。</p></div>`:''}${notes.length?`<div class="swap"><b>⚠️ 未完全対応</b><p class="muted">${notes.join('、')} は誤計算防止のため指標へ未反映です。</p></div>`:''}<p class="tiny" style="color:#bfd0df;margin-top:12px">これは編成比較用の攻撃力指標。敵防御・クリティカル・上限・追撃などを含む最終ダメージそのものではありません。</p></div>`}

const glossaryData=[
 {t:'攻刃',s:'キャラの攻撃力を上げる武器スキル。通常・方陣・EXなど複数の計算枠がある。',body:`<div class="remember"><b>覚える：同じ枠は足し算、違う枠は掛け算。</b></div><p>「攻刃」は攻撃力を上げる武器スキルの総称です。通常攻刃は通常攻刃枠、方陣攻刃は方陣枠、EX攻刃はEX枠に入り、各枠の中では効果量を合計します。その後、枠同士を乗算するため、同じ攻刃だけを増やすより別枠を組み合わせた方が伸びやすい場面があります。</p><div class="exampleBox"><b>例</b><br>通常攻刃50%＋通常攻刃20% → 通常枠70%。<br>通常70%・方陣100%・EX20%なら、それぞれ別の倍率として掛かります。</div>`},
 {t:'方陣攻刃',s:'主にマグナ系の武器が持つ攻刃。マグナ系加護の対象。',body:`<div class="remember"><b>覚える：方陣攻刃＝マグナ加護で伸びる攻刃。</b></div><p>方陣攻刃は通常攻刃とは別の計算枠です。対応するマグナ召喚石の加護は方陣スキルの効果量を増幅します。武器に書かれている「○○方陣」というスキル名が目印です。</p><div class="explain"><b>加護の見方</b><br>「方陣スキルの効果が140%UP」なら、方陣スキル本来の効果量に対して加護分が加わります。通常攻刃やEX攻刃まで140%増えるわけではありません。</div>`},
 {t:'EX攻刃',s:'通常・方陣とは別枠で攻撃力を上げるスキル。',body:`<div class="remember"><b>覚える：EX攻刃は通常・方陣とは別枠。</b></div><p>EX攻刃はEX枠に加算され、通常攻刃枠・方陣攻刃枠とは別に乗算されます。編成全体の攻撃力を考えるときは「どの枠が多いか」だけでなく、召喚石の加護や他の特殊スキルも含めて判断します。</p>`},
 {t:'加護',s:'召喚石をメイン・サポーター等に置いたときに発動する効果。',body:`<div class="remember"><b>覚える：加護は「何を何％強くするか」を見る。</b></div><p>加護には、方陣スキルを強化するもの、通常スキルを強化するもの、属性攻撃力を上げるものなどがあります。同じ「140%」でも対象が違えば計算上の意味も違います。</p><div class="exampleBox"><b>確認する場所</b><br>召喚石の加護説明で「方陣」「通常スキル」「属性攻撃力」など、何が対象なのかを確認します。</div>`},
 {t:'渾身',s:'残りHPが多いほど攻撃性能が高くなる効果。',body:`<div class="remember"><b>覚える：渾身はHPが高いほど強い。</b></div><p>戦闘開始時のようにHPが高い状態では効果を得やすく、被ダメージでHPが減ると効果量も低下します。そのため、回復・バリア・被ダメ軽減などHPを維持する手段との相性が重要です。</p>`},
 {t:'背水',s:'残りHPが少ないほど攻撃性能が高くなる効果。',body:`<div class="remember"><b>覚える：背水はHPが減るほど強い。</b></div><p>HP100%付近では恩恵が小さく、HPを減らすほど火力が上がります。ただし火力を得る代わりに戦闘不能の危険も高まるため、編成によってはHPを安全に減らす手段や耐久手段も必要です。</p>`},
 {t:'守護',s:'最大HPを増やす武器スキル。',body:`<div class="remember"><b>覚える：守護＝最大HPを増やす。</b></div><p>攻撃力そのものを上げる攻刃とは役割が違い、耐久力を確保するためのスキルです。高難度やフルオートでは、火力だけでなく必要HPを確保することが安定につながります。</p>`},
 {t:'ダメージ上限',s:'攻撃力を上げてもダメージが伸びにくくなる上限側の仕組み。',body:`<div class="remember"><b>覚える：上限付近では攻撃力だけ増やしても伸びにくい。</b></div><p>グラブルには通常攻撃・奥義・アビリティなどに上限側の仕組みがあります。十分な基礎火力がある場合は、攻刃を増やすより上限UPや与ダメージ上昇などが有効になる場合があります。</p><div class="explain"><b>注意</b><br>「ダメージ上限UP」と「特殊上限UP」は同じものではありません。対象や適用される上限が異なる効果があります。</div>`},
 {t:'与ダメージ上昇',s:'条件を満たした攻撃に一定量などのダメージを追加する効果。',body:`<div class="remember"><b>覚える：攻撃力UPとは別物。</b></div><p>攻刃のように基礎攻撃力へ倍率を掛ける効果ではなく、攻撃ごとにダメージを上乗せするタイプがあります。多段アビリティや複数回攻撃などでは、適用単位によって価値が大きく変わります。</p>`}
];

const lessonData=[
 {title:'Lesson 1　火力はどう決まる？',remember:'攻撃力だけでは決まらない。複数の「枠」を掛け合わせて伸びる。',body:`<p>武器や召喚石などから作られる攻撃力を土台に、通常攻刃・方陣攻刃・EX攻刃などの倍率を掛けていくのが基本です。簡略化すると、攻撃力 × 通常枠 × 方陣枠 × EX枠 × 属性側の補正……という考え方になります。</p><div class="explain"><b>同じ枠と別の枠</b><br>通常攻刃を複数積んだ場合は通常枠の中で合計します。方陣やEXは別枠なので、その後に掛け算されます。これが「同じ種類だけを大量に積めば必ず最適」とは限らない理由です。</div><div class="exampleBox"><b>さらに実戦では</b><br>渾身・背水、クリティカル、属性補正、与ダメージ上昇、ダメージ上限、敵防御なども関係します。アプリの計算機では、対応できる要素から段階的に内訳を表示します。</div>`},
 {title:'Lesson 2　武器スキルはどう見る？',remember:'まず「効果」「枠」「加護対象」「SLv」を見る。',body:`<p>武器の強さは攻撃力の数字だけでは判断できません。スキルが攻刃なのか守護なのか、通常系か方陣系か、SLvはいくつか、召喚石の加護対象かを確認します。</p><div class="explain"><b>複合スキル</b><br>神威のように攻撃力とHPの両方に関係するものや、攻刃＋技巧など複数効果を持つスキルがあります。武器交換では「攻刃が何％変わるか」だけでなく、失うHP・クリティカル・上限なども一緒に比較します。</div>`},
 {title:'Lesson 3　召喚石の加護って何？',remember:'％だけでなく「何に掛かる加護か」が重要。',body:`<p>マグナ系の加護は対応する方陣スキルを、神石系の加護は対応する通常系スキルを増幅します。一方、属性攻撃力UP加護は武器スキルそのものを増幅する効果とは計算上の位置が違います。</p><div class="exampleBox"><b>メイン＋サポーター</b><br>両方が同じスキル系統を強化する場合、そのスキルを多く持つ編成の価値が上がります。どの石を使うかで武器編成の最適な配分も変わります。</div><div class="explain"><b>サブ加護</b><br>一部の召喚石はサブ装備時にも加護を持ちます。メイン加護とサブ加護は説明文を分けて確認します。</div>`},
 {title:'Lesson 4　HPは火力に関係する？',remember:'渾身は高HP、背水は低HPで火力が変わる。',body:`<p>攻刃だけなら現在HPが直接その攻刃量を変えるわけではありません。しかし渾身・背水が入ると、残りHP割合によって火力が変化します。</p><div class="explain"><b>最大HPも重要</b><br>最大HPが増えると同じ割合まで減るために受けられるダメージ量が増えます。火力計算では「最大HP」と「現在HP割合」を分けて扱う必要があります。</div>`},
 {title:'Lesson 5　ダメージ上限とは？',remember:'火力が十分になると、次は「上限側」を伸ばす必要が出る。',body:`<p>攻撃力を増やし続けても、通常攻撃・奥義・アビリティなどは一定の領域から伸びが鈍くなります。そこでダメージ上限UPや、条件付きの特殊上限、与ダメージ上昇などが重要になります。</p><div class="explain"><b>攻刃との優先順位</b><br>まだ上限に届いていない段階では基礎火力を上げる効果が重要です。すでに上限付近なら、さらに攻刃を増やしても実ダメージの増加が小さいことがあります。</div>`}
];

function searchBlock(id='pageSearch'){return `<div class="searchbox" style="margin-bottom:14px"><span>🔍</span><input id="${id}" placeholder="用語・Lessonを検索"></div>`}

function renderGlossary(a){
 a.innerHTML=`<section>${searchBlock('termSearch')}<h2>📖 用語</h2><div id="termList">${glossaryData.map((x,i)=>`<div class="glossaryCard" data-term="${i}"><h4>${x.t}　›</h4><p>${x.s}</p></div>`).join('')}</div><div id="termOpen"></div></section>`;
 const inp=document.querySelector('#termSearch');
 inp.oninput=()=>{let q=inp.value.trim().toLowerCase();document.querySelectorAll('.glossaryCard').forEach((c,i)=>c.style.display=(!q||glossaryData[i].t.toLowerCase().includes(q)||glossaryData[i].s.toLowerCase().includes(q))?'block':'none')};
 document.querySelectorAll('.glossaryCard').forEach(c=>c.onclick=()=>{let x=glossaryData[+c.dataset.term];document.querySelector('#termOpen').innerHTML=`<div class="termDetail"><button class="backMini" id="closeTerm">← 一覧へ</button><h2>${x.t}</h2><p class="lead">${x.s}</p>${x.body}<button class="smallbtn save" data-save="${x.t}">☆ 保存</button></div>`;document.querySelector('#termList').style.display='none';inp.parentElement.style.display='none';document.querySelector('#closeTerm').onclick=()=>{document.querySelector('#termOpen').innerHTML='';document.querySelector('#termList').style.display='block';inp.parentElement.style.display='flex'};bindSave()});
}

function renderLearn(a){
 a.innerHTML=`<section><h2>📚 学ぶ</h2><div class="lessonNote"><b>この章の見方</b><br>青い「覚える」は最低限の要点です。その下で理由・計算上の位置・具体例まで説明します。数値や現行仕様は実装時点の情報を複数資料で確認しています。</div><div id="lessonList">${lessonData.map((x,i)=>`<div class="lesson" data-lesson="${i}"><div><b>${x.title}</b><p>${x.remember}</p></div><span>›</span></div>`).join('')}</div><div id="lessonOpen"></div></section>`;
 document.querySelectorAll('.lesson').forEach(c=>c.onclick=()=>{let x=lessonData[+c.dataset.lesson];document.querySelector('#lessonOpen').innerHTML=`<div class="lessonDetail"><button class="backMini" id="closeLesson">← Lesson一覧</button><h2>${x.title}</h2><div class="remember"><b>覚える：${x.remember}</b></div>${x.body}<button class="smallbtn save" data-save="${x.title}">☆ 保存</button></div>`;document.querySelector('#lessonList').style.display='none';document.querySelector('.lessonNote').style.display='none';document.querySelector('#closeLesson').onclick=()=>{document.querySelector('#lessonOpen').innerHTML='';document.querySelector('#lessonList').style.display='block';document.querySelector('.lessonNote').style.display='block'};bindSave()});
}
document.querySelector('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch(e.target.value)});render();
</script></body></html>
