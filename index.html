<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>グラブル攻略ノート</title><meta name="theme-color" content="#07111d"><style>
*{box-sizing:border-box}body{margin:0;background:#07111d;color:#edf5ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}main{max-width:760px;margin:auto;min-height:100vh;background:#0b1726}header{padding:38px 22px 25px;background:radial-gradient(circle at 90% 0,#174c68,transparent 45%),linear-gradient(145deg,#0b2235,#08131f)}header b{font-size:11px;letter-spacing:3px;color:#69d4df}h1{font-size:30px;margin:8px 0 5px}header p,.lead{color:#a9bed0}nav{position:sticky;top:0;z-index:5;display:flex;overflow:auto;background:#0a1522ee;backdrop-filter:blur(12px);border-bottom:1px solid #203347}nav button{flex:1;min-width:72px;padding:14px 8px;background:none;border:0;color:#839aad;font-weight:700}nav .on{color:#7de4e4;border-bottom:2px solid #7de4e4}section{padding:22px}.hero{padding:25px;border:1px solid #285069;border-radius:18px;background:linear-gradient(145deg,#102c40,#0d1e2d);margin-bottom:28px}.hero span,.lesson span,.diag>span{font-size:11px;letter-spacing:1.4px;color:#62d2d5;font-weight:800}.hero h2{font-size:27px;margin:8px 0}.primary,.diag button{background:#69d7d7;color:#05202a;border:0;border-radius:10px;padding:13px 16px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{text-align:left;padding:18px;border:1px solid #223b50;border-radius:14px;background:#101f2e;color:white}.card b{display:block;font-size:16px;margin-bottom:8px}.card span{color:#9db1c2;font-size:13px}.search{width:100%;padding:15px;border-radius:12px;border:1px solid #29445a;background:#0d1b29;color:white;font-size:16px;margin:10px 0 18px}.term,.lesson{padding:18px 0;border-bottom:1px solid #1e3244}.term h3,.lesson h3{margin:5px 0 8px;font-size:20px}.term p,.lesson p,.diag p{margin:0;color:#b8c9d7;line-height:1.75}.tag{font-size:11px;color:#66d2d7;font-weight:800}.star{float:right;background:none;border:0;color:#ffd86a;font-size:22px}.diag{border:1px solid #285069;border-radius:18px;padding:23px;background:#0f2232}.diag h3{font-size:22px}.diag button{display:block;width:100%;margin-top:18px}.diag .sub{background:#142b3d;color:#aee8eb;border:1px solid #2c5266}.result,.help{padding:13px;background:#122b3d;border-radius:10px;margin-top:15px}.back{background:none!important;color:#8de1e4!important;border:1px solid #31536a!important}footer{text-align:center;color:#61788c;font-size:11px;padding:40px 20px}@media(max-width:480px){.grid{grid-template-columns:1fr}h1{font-size:27px}}
</style></head><body><main><header><b>GRANBLUE GUIDE</b><h1>グラブル攻略ノート</h1><p>分からない言葉と仕組みを、ここから辿る。</p></header><nav id="nav"></nav><div id="app"></div><footer>グラブル攻略ノート / 試作版</footer></main><script>
const terms=[
['攻刃','武器スキルなどによる攻撃力上昇の代表的な仕組み。通常・方陣・EXなど異なる枠がある。','火力','★★★'],['方陣攻刃','主にマグナ系武器が持つ攻刃。対応するマグナ加護で効果量が強化される。','火力','★★★'],['EX攻刃','通常・方陣とは別系統の攻刃枠。','火力','★★★'],['加護','メイン召喚石やサポーター召喚石などが持つ編成強化効果。対象武器スキルの効果量を増幅するものもある。','召喚石','★★★'],['マグナ編成','方陣スキルとマグナ系召喚石の加護を中心に組む編成。','編成','★★★'],['神石編成','オプティマスシリーズの加護と通常枠の対象スキルを中心に組む編成。','編成','★★★'],['片面','メイン石・サポーター石の片方だけを同系統の加護石にする組み方。','編成','★★★'],['両面','メイン石・サポーター石の両方を同系統の加護石にする組み方。','編成','★★★'],['渾身','HPが高いほど攻撃性能が高くなる効果の総称として使われる。','火力','★★★'],['背水','HPが低いほど攻撃性能が高くなる効果の総称として使われる。','火力','★★★'],['技巧','クリティカル発動率に関係する武器スキル。','火力','★★★'],['確クリ','条件を満たした攻撃でクリティカル発動率を100%にした状態を指す通称。','火力','★★★'],['ダメージ上限','火力を上げ続けてもダメージが同じ割合では伸びなくなる領域に関係する仕組み。','火力','★★★'],['与ダメージ上昇','条件を満たす攻撃のダメージに加算を行うタイプの効果。攻撃UPや上限UPとは別物。','火力','★★★'],['追撃','通常攻撃などに追加して発生するダメージ。複数の追撃は種類によって共存可否が異なる。','戦闘','★★★'],['DA','ダブルアタック。1ターンに2回通常攻撃すること。','戦闘','★★★'],['TA','トリプルアタック。1ターンに3回通常攻撃すること。','戦闘','★★★'],['ポチ','アビリティや召喚などのボタン操作を数えるプレイヤー用語。','俗語','★★★'],['0ポチ','アビリティ等の操作をせず、攻撃など最小限の操作で処理する編成を表す時に使う。','俗語','★★★'],['リロ','リロード。戦闘演出を待たず次の操作へ進む目的などで使われる。','速度','★★★'],['硬直','攻撃後などに次の攻撃操作へ移れない待ち時間。高速周回では重要。','速度','★★★'],['DPS','実時間あたりにどれだけダメージを出せるかを見る考え方。','速度','★★'],['DPT','1ターンあたりのダメージを見る考え方。','速度','★★'],['CT','敵の特殊技発動に関係するカウント。','敵行動','★★★'],['HPトリガー','敵HPが一定値に達した時などに発生する特殊行動を指す通称。','敵行動','★★★'],['予兆','バトルシステムVer.2で敵の特殊技と解除条件などを事前表示する仕組み。','V2','★★★'],['予兆解除','予兆に表示された条件を達成し、その特殊技の発動を止めること。','V2','★★★'],['ガード','V2で攻撃行動を行わない代わりに被ダメージを抑える防御行動。','V2','★★★'],['FC','フェイタルチェインの略。V2で使用する専用システム。','V2','★★★'],['ディスペル','敵の強化効果を消去する効果。','戦闘','★★★'],['クリア','味方の弱体効果を回復する効果。','戦闘','★★★'],['マウント','弱体効果無効を指して使われる定番の通称。','戦闘','★★★'],['スロウ','敵のCTを減少させる効果。','戦闘','★★★'],['グラビ','グラビティ系効果の通称。敵の最大CTを増加させる。','戦闘','★★'],['自発','自分でマルチバトルを開始すること。','マルチ','★★★'],['救援','他プレイヤーが開始したマルチに参加すること。','マルチ','★★★'],['貢献度','マルチやイベントで戦闘への貢献を数値化したもの。','マルチ','★★★'],['青箱','一部マルチに存在する特別報酬。獲得条件や仕組みはバトルごとに確認が必要。','マルチ','★★★'],['フルオ','フルオートの略。設定に従って自動で戦闘を進める。','戦闘','★★★'],['ムーブ','戦闘での操作手順。「1T目○○→2T目○○」のように使う。','俗語','★★★'],['通常軸','通常攻撃を主なダメージ源にする編成・戦い方。','編成','★★★'],['奥義軸','奥義を主なダメージ源にする編成・戦い方。','編成','★★★'],['アビ軸','ダメージアビリティを主なダメージ源にする編成・戦い方。','編成','★★★']];
const lessons=[['火力はどう決まる？','基礎','表示攻撃力だけで最終ダメージは決まりません。通常・方陣・EXなどの攻撃要素、属性、敵防御、クリティカル、与ダメ、上限など複数の要素が関係します。'],['加護って何を強くする？','基礎','加護は最終ダメージを表示%ぶん直接増やすという意味ではありません。マグナ石や神石では、指定された武器スキルの効果量を増幅します。'],['片面と両面の考え方','中級','両面は対象スキルへの加護量を大きく確保しやすく、片面はもう片方に属性石など別の加護を置けます。目的と武器構成で選びます。'],['上限・与ダメ・攻撃UPの違い','中級','攻撃UP、上限UP、与ダメージ上昇は役割が異なります。どこが不足しているかを見て伸ばす要素を選びます。'],['表示ダメージと速度は別','中級','1ターンのダメージが大きくても、演出や硬直が長ければ実時間の速度は落ちます。周回や救援ではDPTだけでなくDPS・操作数・硬直も見ます。'],['V2の基本','基礎','Ver.2では敵の特殊技が予兆として表示され、条件達成で解除できる場合があります。解除できない時はガードなどで受ける判断も必要です。']];
let tab='home',step=0,help=null,q='';let fav=JSON.parse(localStorage.getItem('gbfFav')||'[]');const tabs=[['home','ホーム'],['terms','用語辞典'],['learn','仕組み'],['diagnose','診断'],['fav','★保存']];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function nav(){document.querySelector('#nav').innerHTML=tabs.map(x=>`<button class="${tab===x[0]?'on':''}" data-tab="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;help=null;render()})}
function render(){nav();const a=document.querySelector('#app');if(tab==='home')a.innerHTML=`<section><div class="hero"><span>まずここから</span><h2>知らないまま進めない。</h2><p>★★★の必須用語から、火力・加護・V2・マルチまで繋げて理解するための攻略ノート。</p><button class="primary" onclick="tab='terms';render()">必須用語を見る →</button></div><h3>学習カテゴリ</h3><div class="grid">${[['📖 用語辞典','攻略で頻出する用語を検索。','terms'],['📚 仕組みを学ぶ','火力・加護・上限を理解する。','learn'],['🩺 困った時の診断','YES / NOで原因を切り分ける。','diagnose'],['⭐ あとで読む',fav.length+'件保存中','fav']].map(x=>`<button class="card" onclick="tab='${x[2]}';render()"><b>${x[0]}</b><span>${x[1]}</span></button>`).join('')}</div></section>`;
if(tab==='terms'){let f=terms.filter(x=>x.join(' ').toLowerCase().includes(q.toLowerCase()));a.innerHTML=`<section><h2>用語辞典</h2><input id="search" class="search" placeholder="例：硬直、加護、青箱…" value="${esc(q)}"><div>${f.map(x=>`<article class="term"><div class="tag">${x[2]} ・ ${x[3]}</div><h3>${x[0]} <button class="star" data-star="${x[0]}">${fav.includes(x[0])?'★':'☆'}</button></h3><p>${x[1]}</p></article>`).join('')}</div></section>`;document.querySelector('#search').oninput=e=>{q=e.target.value;render()};document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{let x=b.dataset.star;fav=fav.includes(x)?fav.filter(v=>v!==x):[...fav,x];localStorage.setItem('gbfFav',JSON.stringify(fav));render()})}
if(tab==='learn')a.innerHTML=`<section><h2>仕組みを学ぶ</h2><p class="lead">計算式を丸暗記するのではなく、「何がどこに効いているか」を順番に理解する。</p>${lessons.map((x,i)=>`<article class="lesson"><span>LESSON ${String(i+1).padStart(2,'0')} ・ ${x[1]}</span><h3>${x[0]}</h3><p>${x[2]}</p></article>`).join('')}</section>`;
if(tab==='diagnose'){const qs=[['① 有利属性で戦っている？','敵に対して有利属性の編成か確認。','属性相性を確認しよう','まず敵の属性と、自分の編成属性を確認します。有利属性が分からない場合は属性相性の基礎から確認します。'],['② 武器のスキルLvは十分？','武器LvだけでなくスキルLvも確認。','武器スキルLvを確認しよう','武器詳細からスキルLvを確認します。武器LvとスキルLvは別です。まず主力武器のスキルが育っているか見ます。'],['③ 加護と武器スキルが合っている？','マグナ加護なら方陣、神石加護なら対象となる通常スキルを確認。','加護と武器スキルを合わせよう','メイン石・サポ石の加護文と、武器のスキル名を確認します。分からなければ「加護」の用語と仕組み講座を先に読みます。'],['④ 何が弱い？','通常攻撃・奥義・アビダメ・実時間の速度のどこに困っているか切り分ける。','個別診断へ','通常・奥義・アビ・速度は伸ばし方が違います。ここから個別診断へ分岐します。']];let x=qs[step];a.innerHTML=`<section><h2>🩺 火力が出ない</h2><p class="lead">画面を確認しながら順番に原因を切り分けます。</p><div class="diag"><span>STEP ${step+1} / ${qs.length}</span><h3>${x[0]}</h3><p>${x[1]}</p>${help?`<div class="help"><b>${x[2]}</b><p>${x[3]}</p><button class="back" onclick="help=null;render()">← 診断に戻る</button><button class="sub" onclick="tab='learn';help=null;render()">関連する仕組みを見る</button></div>`:step<3?`<button onclick="step++;render()">YES → 次へ</button><button class="sub" onclick="help=true;render()">NO / わからない → 改善方法を見る</button>`:`<div class="result">第1版ではここまで。次版で「通常」「奥義」「アビ」「速度」の個別診断へ分岐します。</div><button onclick="step=0;render()">最初から確認</button>`}</div></section>`}
if(tab==='fav')a.innerHTML=`<section><h2>保存した用語</h2>${fav.length?terms.filter(x=>fav.includes(x[0])).map(x=>`<article class="lesson"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join(''):'<p>まだ保存はありません。用語辞典の☆を押すとここに残ります。</p>'}</section>`}
render();
</script></body></html>
