name: GBF Update Check

on:
  workflow_dispatch:

  schedule:
    # 毎週月曜日 06:00 JST
    # GitHub Actions の cron は UTC なので日曜21:00
    - cron: "0 21 * * 0"

permissions:
  contents: write
  issues: write

jobs:
  check-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check GBF official site
        id: check
        run: |
          python scripts/check_gbf_updates.py | tee result.txt

          if grep -q "UPDATE_FOUND=true" result.txt; then
            echo "update_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save update state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .gbf-update-state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update GBF check state"
            git push
          fi

      - name: Create update candidate issue
        if: steps.check.outputs.update_found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "グラブル攻略ノート：更新候補を検出" \
            --body-file gbf-update-report.md
